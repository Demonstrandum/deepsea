# Build and publish the bundled macOS app (apps/macos/bundle) as a GitHub Release.
#
# Runs on `Run workflow` only (variant, notes, draft): the default branch is
# rebuilt by `dsd topics integrate`, whose head is always a merge commit, so a
# push trigger keyed on a commit subject could never fire here. What runs is exactly
# `node apps/macos/bundle/release.mjs`: the pinned harness built by dsd, the
# plugins packed and installed into a production closure, Node fetched and
# verified, the app assembled, pruned and ad-hoc signed, the styled DMG made,
# the release created with the DMG and its .sha256 under tag `<variant>-<build>`.
#
# A macOS 26 runner: the wrapper uses NSGlassEffectView, which needs the
# macOS 26 SDK. The harness is cloned beside this checkout, where harness.lock
# expects it (`../deepsea-harness`), at the pinned commit.
name: Release app

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Variant to build (release channel; release is marked Latest)"
        required: true
        type: string
        default: release
      notes:
        description: "Release notes (default: commit subjects since the channel's previous tag)"
        required: false
        type: string
      draft:
        description: Create as a draft
        required: false
        type: boolean
        default: false

concurrency:
  group: release-app
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      npm_config_manage_package_manager_versions: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          path: deepsea
          fetch-depth: 0
      - name: Harness at the pinned commit
        working-directory: deepsea
        run: |
          commit=$(awk '$1 == "commit" { print $2 }' harness.lock)
          git clone --quiet https://github.com/taliesinb/deepsea-harness.git ../deepsea-harness
          git -C ../deepsea-harness checkout --quiet "$commit"
          echo "harness $commit"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the harness and link it
        working-directory: deepsea
        run: |
          node tools/dsd/bin/dsd.mjs builds make
          node tools/dsd/bin/dsd.mjs link
      - name: pnpm 12 for the bundle stage
        run: npm install -g pnpm@12 --prefix "$HOME/.pnpm12" && echo "$HOME/.pnpm12/bin" >> "$GITHUB_PATH"
      - name: Build and publish
        working-directory: deepsea
        run: |
          args=(--variant "${{ inputs.variant || 'release' }}" --repo "$GITHUB_REPOSITORY")
          [ -n "${{ inputs.notes }}" ] && args+=(--notes "${{ inputs.notes }}")
          [ "${{ inputs.draft }}" = "true" ] && args+=(--draft)
          node apps/macos/bundle/release.mjs "${args[@]}"
      - name: Summary
        if: always()
        working-directory: deepsea
        run: |
          { echo "### Releases"; gh release list --repo "$GITHUB_REPOSITORY" --limit 10 | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
